# ============================================================
#  Configurações da API Tarefinhas
#  Os valores com ${...:padrão} podem ser trocados por variáveis
#  de ambiente (o docker-compose.yml faz isso).
# ============================================================

spring.application.name=tarefinhas-api
server.port=8080

# --- Conexão com o PostgreSQL ---
# Rodando fora do Docker, o banco fica em localhost:5544 (veja docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5544/tarefinhas}
spring.datasource.username=${DB_USUARIO:tarefinhas}
spring.datasource.password=${DB_SENHA:tarefinhas}

# --- JPA / Hibernate ---
# "validate": o Hibernate só confere se as classes batem com as tabelas.
# Quem CRIA as tabelas é o Flyway, com os arquivos de db/migration.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Mostra no log os SQLs que o Hibernate executa (bom para estudar)
spring.jpa.show-sql=true

# --- Flyway (cria as tabelas e os dados de exemplo) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- JSON ---
# Se um campo true/false não vier no JSON, considera "false" em vez de dar erro
spring.jackson.deserialization.fail-on-null-for-primitives=false
