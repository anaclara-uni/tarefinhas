<aside class="barra">
  <!-- Logo -->
  <div class="marca">
    <div class="marca-icone">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.35-7-10a4 4 0 0 1 7-2.65A4 4 0 0 1 19 10c0 5.65-7 10-7 10z"></path><path d="M9.2 11.2l2 2 3.6-3.6"></path></svg>
    </div>
    <span class="marca-nome">Tarefinhas</span>
  </div>

  <a routerLink="/tarefas/nova" [queryParams]="listaId() ? { lista: listaId() } : {}" class="botao-nova">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    Nova tarefa
  </a>

  <!-- Visões: Hoje, Próximos 7 dias, Todas, Concluídas -->
  <nav aria-label="Visões" class="grupo">
    @for (v of visoes; track v.id) {
      <button type="button" class="item" [class.ativo]="visaoAtiva(v.id)" [attr.aria-pressed]="visaoAtiva(v.id)" (click)="escolherVisao.emit(v.id)">
        @switch (v.id) {
          @case ('hoje') {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          }
          @case ('semana') {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="4"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
          }
          @case ('todas') {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><circle cx="4.5" cy="6" r="1"></circle><circle cx="4.5" cy="12" r="1"></circle><circle cx="4.5" cy="18" r="1"></circle></svg>
          }
          @case ('concluidas') {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.5 2.5L16 9.5"></path></svg>
          }
        }
        <span class="item-nome">{{ v.nome }}</span>
        <span class="contagem">{{ contagemDa(v.id) }}</span>
      </button>
    }
  </nav>

  <!-- Minhas listas (com criar, renomear e excluir) -->
  <app-listas-menu [listas]="listas()" [listaId]="listaId()"
    (escolherLista)="escolherLista.emit($event)" (listasMudaram)="listasMudaram.emit()" />

  <div class="espaco"></div>

  <!-- Dica do dia (clique para ver outra) -->
  <button type="button" class="dica" title="Clique para ver outra dica" (click)="proximaDica()">
    <span class="dica-titulo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
      Dica do dia
    </span>
    <span class="dica-texto">{{ dica() }}</span>
  </button>

  <!-- Usuário logado -->
  <div class="usuario">
    <div class="avatar">{{ iniciais() }}</div>
    <div class="usuario-dados">
      <p class="usuario-nome">{{ usuario().nome }}</p>
      <p class="usuario-papel">{{ usuario().papel }}</p>
    </div>
    <a routerLink="/perfil" class="botao-config" aria-label="Perfil e configurações" title="Perfil e configurações">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>
    </a>
  </div>
</aside>
