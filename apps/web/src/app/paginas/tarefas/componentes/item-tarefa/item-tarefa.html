<div class="linha" [class.feita]="tarefa().concluida">
  <!-- Bolinha de concluir -->
  <button type="button" class="botao-check" (click)="concluir.emit()"
          [attr.aria-label]="(tarefa().concluida ? 'Marcar como pendente: ' : 'Marcar como concluída: ') + tarefa().titulo"
          [attr.aria-pressed]="tarefa().concluida">
    <span class="check">
      @if (tarefa().concluida) {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      }
    </span>
  </button>

  <div class="conteudo">
    <!-- Clicar no título abre a edição -->
    <a class="titulo" [routerLink]="['/tarefas', tarefa().id, 'editar']">{{ tarefa().titulo }}</a>

    <div class="detalhes">
      @if (tarefa().listaNome) {
        <span class="detalhe"><span class="bolinha" [style.background]="tarefa().listaCor"></span>{{ tarefa().listaNome }}</span>
      }
      @if (data()) {
        <span class="detalhe data" [class.hoje]="ehHoje()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="4"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>{{ data() }}
        </span>
      }
      <span class="etiqueta" [style.background]="prioridade().fundo" [style.color]="prioridade().texto">{{ prioridade().nome }}</span>
    </div>
  </div>

  <button type="button" class="botao-icone" [class.favorita]="tarefa().favorita" (click)="favoritar.emit()"
          [attr.aria-label]="tarefa().favorita ? 'Remover dos favoritos' : 'Favoritar'" [attr.aria-pressed]="tarefa().favorita">
    <svg width="20" height="20" viewBox="0 0 24 24" [attr.fill]="tarefa().favorita ? '#F2C14E' : 'none'" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg>
  </button>

  <button type="button" class="botao-icone" aria-label="Excluir tarefa" (click)="excluir.emit()">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"></path></svg>
  </button>
</div>
