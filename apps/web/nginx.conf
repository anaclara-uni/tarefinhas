# Configuração do nginx (o servidor que entrega o site dentro do Docker)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Tudo que começa com /api vai para o container da API (Spring Boot)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Qualquer outro endereço (/login, /tarefas...) abre o Angular,
    # que decide qual tela mostrar
    location / {
        try_files $uri $uri/ /index.html;
    }
}
