# ============================================================
#  Tarefinhas - sobe tudo com um comando:  docker compose up -d --build
#
#  Depois de subir:
#    App (site) ........ http://localhost:4200
#    API ............... http://localhost:8080/api
#    Swagger (API) ..... http://localhost:8080/swagger-ui.html
#    Adminer (banco) ... http://localhost:8081
# ============================================================

name: tarefinhas

services:

  # Banco de dados PostgreSQL
  db:
    image: postgres:17-alpine
    container_name: tarefinhas-db
    environment:
      POSTGRES_DB: tarefinhas
      POSTGRES_USER: tarefinhas
      POSTGRES_PASSWORD: tarefinhas
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      # 5544 do lado de fora para não brigar com um Postgres já instalado no computador
      - "5544:5432"
    volumes:
      # Os dados ficam guardados aqui, mesmo desligando o Docker
      - dados-banco:/var/lib/postgresql/data
    healthcheck:
      # Só considera "pronto" quando o banco aceita conexões
      test: ["CMD-SHELL", "pg_isready -U tarefinhas -d tarefinhas"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # API em Java / Spring Boot
  api:
    build: ./apps/api
    container_name: tarefinhas-api
    environment:
      DB_URL: jdbc:postgresql://db:5432/tarefinhas
      DB_USUARIO: tarefinhas
      DB_SENHA: tarefinhas
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy   # espera o banco ficar pronto
    restart: unless-stopped

  # Site em Angular (servido pelo nginx, que também repassa /api para a API)
  web:
    build: ./apps/web
    container_name: tarefinhas-web
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

  # Adminer: página para ver as tabelas do banco pelo navegador
  # Entrar com: Sistema PostgreSQL | Servidor db | Usuário tarefinhas | Senha tarefinhas | Base tarefinhas
  adminer:
    image: adminer:latest
    container_name: tarefinhas-adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  dados-banco:
